server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /Open-One-Setup.exe {
    add_header Content-Disposition 'attachment; filename="Open-One-Setup.exe"';
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location = /latest.yml {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location = /releases/latest.yml {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files /latest.yml =404;
  }

  location ~ ^/releases/(Open-One-Setup.*)$ {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files /$1 =404;
  }

  location = / {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location = /styles.css {
    add_header Cache-Control "no-store, max-age=0" always;
  }

  location ^~ /assets/ {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
