name: Repair OpenCode lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore and resolve the lockfile
        run: |
          git show 2f7a30d:pnpm-lock.yaml > pnpm-lock.yaml
          pnpm install --lockfile-only
      - name: Commit the repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/repair-opencode-lock.yml
          git commit -m "fix: restore OpenCode dependency lock"
          git push origin HEAD:custom
